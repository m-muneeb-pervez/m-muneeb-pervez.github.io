<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, Arimo, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cfc9bb"/></marker><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e39274"/></marker></defs>
<rect width="720" height="340" fill="#161513"/>
<text x="6" y="26" font-size="18" font-weight="700" fill="#e9e5db" text-anchor="start">Same tasks, five team structures</text>
<g transform="translate(38,49.2) scale(1.2)"><circle cx="20" cy="14" r="8" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="62" y="100" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Single agent</text>
<g transform="translate(150,49.2) scale(1.2)"><path d="M20,5 L6,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="5" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="6" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="174" y="100" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Centralized</text>
<g transform="translate(262,49.2) scale(1.2)"><path d="M6,14 L20,14" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,14 L34,14" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="6" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="286" y="100" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Decentralized</text>
<g transform="translate(94,113.2) scale(1.2)"><path d="M20,5 L6,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M6,24 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,24 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="5" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="6" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="118" y="164" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Hybrid</text>
<g transform="translate(206,113.2) scale(1.2)"><path d="M6,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M34,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="6" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="230" y="164" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Independent</text>
<text x="6" y="192" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">In a team the tools are split, so no</text>
<text x="6" y="211" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">agent can finish alone.</text>
<path d="M354,10 V214" stroke="#4b473f" stroke-width="1.2"/>
<text x="366" y="26" font-size="18" font-weight="700" fill="#e9e5db" text-anchor="start">One payload, three ways in</text>
<rect x="366" y="40" width="108" height="48" rx="8" fill="#161513" stroke="#4b473f" stroke-width="1.4"/>
<text x="420" y="60" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">Instruction</text>
<text x="420" y="78" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">injection</text>
<path d="M420,88 V100" stroke="#e39274" stroke-width="1.8"/>
<rect x="486" y="40" width="108" height="48" rx="8" fill="#161513" stroke="#4b473f" stroke-width="1.4"/>
<text x="540" y="60" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">Tool</text>
<text x="540" y="78" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">poisoning</text>
<path d="M540,88 V100" stroke="#e39274" stroke-width="1.8"/>
<rect x="606" y="40" width="108" height="48" rx="8" fill="#161513" stroke="#4b473f" stroke-width="1.4"/>
<text x="660" y="60" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">Message</text>
<text x="660" y="78" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">tampering</text>
<path d="M660,88 V100" stroke="#e39274" stroke-width="1.8"/>
<path d="M420,100 H660" stroke="#e39274" stroke-width="1.8"/>
<path d="M420,100 L420,110" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<rect x="366" y="112" width="100" height="44" rx="6" fill="#161513" stroke="#cfc9bb" stroke-width="1.6"/>
<text x="416.0" y="140" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">Relay agent</text>
<rect x="490" y="112" width="100" height="44" rx="6" fill="#161513" stroke="#cfc9bb" stroke-width="1.6"/>
<text x="540.0" y="140" font-size="15" font-weight="700" fill="#e9e5db" text-anchor="middle">Record</text>
<rect x="614" y="112" width="100" height="44" rx="6" fill="#3f2e26" stroke="#e39274" stroke-width="1.8"/>
<text x="664.0" y="140" font-size="15" font-weight="700" fill="#e39274" text-anchor="middle">Target agent</text>
<path d="M468,134 L488,134" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M592,134 L612,134" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<text x="366" y="180" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">The relay agent writes the payload into</text>
<text x="366" y="199" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">a record. The target agent reads it and</text>
<text x="366" y="218" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">makes the harmful write.</text>
<path d="M6,234 H714" stroke="#4b473f" stroke-width="1.2"/>
<text x="6" y="270" font-size="28" font-weight="700" fill="#e39274" text-anchor="start">76%</text>
<text x="6" y="292" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">of runs: a tampered</text>
<text x="6" y="311" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">message succeeds</text>
<text x="176" y="270" font-size="28" font-weight="700" fill="#e9e5db" text-anchor="start">39 to 40%</text>
<text x="176" y="292" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">on orchestrated teams,</text>
<text x="176" y="311" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">vs 41% for one agent,</text>
<text x="176" y="330" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">same attacks</text>
<text x="346" y="270" font-size="28" font-weight="700" fill="#e9e5db" text-anchor="start">42 to 49%</text>
<text x="346" y="292" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">of the task done by</text>
<text x="346" y="311" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">orchestrated teams, vs</text>
<text x="346" y="330" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">90% for one agent</text>
<text x="526" y="262" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">Attack success and task</text>
<text x="526" y="281" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">completion come from the</text>
<text x="526" y="300" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">final state, with no</text>
<text x="526" y="319" font-size="14.5" font-weight="400" fill="#a39d90" text-anchor="start">language model as judge.</text>
</svg>
