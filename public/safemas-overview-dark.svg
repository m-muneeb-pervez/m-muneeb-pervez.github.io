<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 840" width="520" height="840" font-family="Arial, Helvetica, Arimo, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cfc9bb"/></marker><marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e39274"/></marker></defs>
<rect width="520" height="840" fill="#161513"/>
<text x="6" y="28" font-size="19" font-weight="700" fill="#e9e5db" text-anchor="start">The same tasks, five team structures</text>
<g transform="translate(27,60.5) scale(1.25)"><circle cx="20" cy="14" r="8" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="52" y="122" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Single agent</text>
<g transform="translate(131,60.5) scale(1.25)"><path d="M20,5 L6,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="5" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="6" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="156" y="122" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Centralized</text>
<g transform="translate(235,60.5) scale(1.25)"><path d="M6,14 L20,14" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,14 L34,14" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="6" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="260" y="122" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Decentralized</text>
<g transform="translate(339,60.5) scale(1.25)"><path d="M20,5 L6,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M6,24 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,24 L34,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="5" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="6" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="24" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="364" y="122" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Hybrid</text>
<g transform="translate(443,60.5) scale(1.25)"><path d="M6,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M34,5 L20,24" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="6" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="34" cy="5" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="20" cy="24" r="3.8" fill="#cfc9bb" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="468" y="122" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Independent</text>
<text x="6" y="154" font-size="16" font-weight="400" fill="#a39d90" text-anchor="start">In a team the tools are split, so no agent can finish alone.</text>
<path d="M6,180 H514" stroke="#4b473f" stroke-width="1.2"/>
<text x="6" y="214" font-size="19" font-weight="700" fill="#e9e5db" text-anchor="start">One payload, three ways to plant it</text>
<g transform="translate(65,244.5) scale(1.25)"><rect x="5" y="1" width="30" height="12" rx="2.5" fill="none" stroke="#cfc9bb" stroke-width="1.5"/><path d="M10,5 L28,5" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M10,9 L22,9" stroke="#cfc9bb" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M20,13 L20,17" stroke="#e39274" stroke-width="1.8" stroke-linecap="round" fill="none"/><polygon points="16.8,14.5 23.2,14.5 20,19.5" fill="#e39274"/><circle cx="20" cy="24.5" r="3" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="90" y="304" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Instruction injection</text>
<g transform="translate(235,244.5) scale(1.25)"><rect x="2" y="3" width="13" height="13" rx="2.5" fill="none" stroke="#cfc9bb" stroke-width="1.5"/><path d="M15,9.5 L33,9.5 L33,14" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/><polygon points="29.8,12.5 36.2,12.5 33,17.5" fill="#e39274"/><circle cx="33" cy="23.5" r="3" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="260" y="304" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Tool poisoning</text>
<g transform="translate(405,244.5) scale(1.25)"><path d="M9,14 L15,14 L19,6 L22,22 L25,14 L31,14" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/><circle cx="5" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/><circle cx="35" cy="14" r="3.4" fill="#161513" stroke="#cfc9bb" stroke-width="1.5"/></g>
<text x="430" y="304" font-size="15" font-weight="400" fill="#e9e5db" text-anchor="middle">Message tampering</text>
<path d="M90,316 V336" stroke="#e39274" stroke-width="1.8"/>
<path d="M260,316 V336" stroke="#e39274" stroke-width="1.8"/>
<path d="M430,316 V336" stroke="#e39274" stroke-width="1.8"/>
<path d="M73,336 H430" stroke="#e39274" stroke-width="1.8"/>
<path d="M73,336 L73,362" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<rect x="6" y="364" width="134" height="50" rx="6" fill="#161513" stroke="#cfc9bb" stroke-width="1.6"/>
<text x="73.0" y="395" font-size="17" font-weight="700" fill="#e9e5db" text-anchor="middle">Relay agent</text>
<rect x="193" y="364" width="134" height="50" rx="6" fill="#161513" stroke="#cfc9bb" stroke-width="1.6"/>
<text x="260.0" y="395" font-size="17" font-weight="700" fill="#e9e5db" text-anchor="middle">Record</text>
<rect x="386" y="364" width="128" height="50" rx="6" fill="#3f2e26" stroke="#e39274" stroke-width="1.8"/>
<text x="450.0" y="395" font-size="17" font-weight="700" fill="#e39274" text-anchor="middle">Target agent</text>
<path d="M140,389.0 L191,389.0" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M327,389.0 L384,389.0" fill="none" stroke="#e39274" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#b)"/>
<text x="6" y="446" font-size="16" font-weight="400" fill="#a39d90" text-anchor="start">The relay agent writes the payload into a record.</text>
<text x="6" y="470" font-size="16" font-weight="400" fill="#a39d90" text-anchor="start">The target agent reads it and makes the harmful write.</text>
<path d="M6,496 H514" stroke="#4b473f" stroke-width="1.2"/>
<text x="6" y="530" font-size="19" font-weight="700" fill="#e9e5db" text-anchor="start">What is measured</text>
<rect x="6" y="548" width="164" height="46" rx="6" fill="#161513" stroke="#4b473f" stroke-width="1.6"/>
<text x="88" y="578" font-size="16.5" font-weight="700" fill="#e9e5db" text-anchor="middle">Attack success</text>
<rect x="178" y="548" width="164" height="46" rx="6" fill="#161513" stroke="#4b473f" stroke-width="1.6"/>
<text x="260" y="578" font-size="16.5" font-weight="700" fill="#e9e5db" text-anchor="middle">Task completion</text>
<rect x="350" y="548" width="164" height="46" rx="6" fill="#161513" stroke="#4b473f" stroke-width="1.6"/>
<text x="432" y="578" font-size="16.5" font-weight="700" fill="#e9e5db" text-anchor="middle">Model calls</text>
<text x="6" y="624" font-size="16" font-weight="400" fill="#a39d90" text-anchor="start">Attack success and task completion come from the final state,</text>
<text x="6" y="646" font-size="16" font-weight="400" fill="#a39d90" text-anchor="start">with no language model as judge.</text>
<path d="M6,672 H514" stroke="#4b473f" stroke-width="1.2"/>
<text x="6" y="706" font-size="19" font-weight="700" fill="#e9e5db" text-anchor="start">What it finds</text>
<text x="6" y="756" font-size="30" font-weight="700" fill="#e39274" text-anchor="start">76%</text>
<text x="6" y="784" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">of runs: a tampered</text>
<text x="6" y="804" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">message succeeds</text>
<text x="178" y="756" font-size="30" font-weight="700" fill="#e9e5db" text-anchor="start">39 to 40%</text>
<text x="178" y="784" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">on orchestrated teams,</text>
<text x="178" y="804" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">vs 41% for one agent,</text>
<text x="178" y="824" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">same attacks</text>
<text x="350" y="756" font-size="30" font-weight="700" fill="#e9e5db" text-anchor="start">42 to 49%</text>
<text x="350" y="784" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">of the task done by</text>
<text x="350" y="804" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">orchestrated teams, vs</text>
<text x="350" y="824" font-size="15" font-weight="400" fill="#a39d90" text-anchor="start">90% for one agent</text>
</svg>
